name: Ragnarok Collection Closeout

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ragnarok-collection-closeout.yml'
      - 'ragnarok-data-pipeline/build_ai_db.py.gz.b64'
      - 'ragnarok-data-pipeline/merge_supabase_current.py.gz.b64'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ragnarok-collection-closeout
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4

      - name: Checkout direct source repositories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p sources
          git clone --depth 1 https://github.com/rathena/rathena.git sources/rathena
          git clone --depth 1 https://github.com/OpenKore/openkore.git sources/openkore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install builders
        run: python -m pip install --upgrade duckdb pyarrow pandas pyyaml requests zstandard

      - name: Restore and harden builders
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d ragnarok-data-pipeline/build_ai_db.py.gz.b64 | gzip -d > /tmp/build_ai_db.py
          base64 -d ragnarok-data-pipeline/merge_supabase_current.py.gz.b64 | gzip -d > /tmp/merge_supabase_current.py
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('/tmp/merge_supabase_current.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          replacement = ast.parse(
              'print(f"WARNING: Supabase snapshot kept with {len(errors)} documented fetch errors")'
          ).body[0]

          class PatchFatalSnapshotGuard(ast.NodeTransformer):
              def __init__(self):
                  self.changed = 0
                  self.matches = []

              def visit_Raise(self, node):
                  self.generic_visit(node)
                  if node.exc is None:
                      return node
                  text = ast.unparse(node.exc)
                  if 'Supabase snapshot has' in text and 'fetch errors' in text:
                      self.changed += 1
                      self.matches.append((getattr(node, 'lineno', None), text))
                      return ast.copy_location(replacement, node)
                  return node

          patcher = PatchFatalSnapshotGuard()
          patched = patcher.visit(tree)
          ast.fix_missing_locations(patched)
          if patcher.changed != 1:
              raises = [
                  (getattr(node, 'lineno', None), ast.unparse(node.exc))
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Raise) and node.exc is not None
              ]
              raise RuntimeError(
                  f'expected exactly one Supabase snapshot error guard; '
                  f'changed={patcher.changed}, raises={raises!r}'
              )
          path.write_text(ast.unparse(patched) + '\n', encoding='utf-8')
          print({'patched': patcher.changed, 'matches': patcher.matches})
          PY
          python -m py_compile /tmp/build_ai_db.py /tmp/merge_supabase_current.py

      - name: Build direct-source database
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf export upload
          python /tmp/build_ai_db.py \
            --rathena sources/rathena \
            --openkore sources/openkore \
            --out export

      - name: Merge current Supabase cache and relationship details
        shell: bash
        env:
          RAGNAROK_EXPORT_WORKERS: '12'
        run: |
          set -euxo pipefail
          python /tmp/merge_supabase_current.py --export export --workers 12

      - name: Capture live graph inventory
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 \
            --max-time 90 \
            'https://lejxxzrjorfexgtvegjf.supabase.co/functions/v1/ragnarok-graph?api=inventory' \
            -o export/manifest/graph_inventory.json
          python -m json.tool export/manifest/graph_inventory.json >/dev/null

      - name: Verify and write collection closeout ledger
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import duckdb

          root = Path('export')
          manifest_path = root / 'manifest' / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          inventory = json.loads((root / 'manifest' / 'graph_inventory.json').read_text(encoding='utf-8'))
          graph = inventory.get('graph') or inventory

          db = root / 'ai' / 'ragnarok-ai.duckdb'
          con = duckdb.connect(str(db), read_only=True)
          tables = {row[0] for row in con.execute('show tables').fetchall()}

          def count(table):
              if table not in tables:
                  return None
              return int(con.execute(f'select count(*) from "{table}"').fetchone()[0])

          counts = {
              'ai_entities_current': count('ai_entities_current'),
              'ai_relation_edges': count('ai_relation_edges'),
              'supabase_entity_payloads': count('supabase_entity_payloads'),
              'gnjoy_market_current': count('gnjoy_market_current'),
              'gnjoy_live_current': count('gnjoy_live_current'),
              'direct_entities': count('entities'),
              'direct_aliases': count('aliases'),
          }
          con.close()

          errors = manifest.get('errors') or []
          assert (counts['ai_entities_current'] or 0) > 50000, counts
          assert (counts['ai_relation_edges'] or 0) > 40000, counts
          assert (counts['supabase_entity_payloads'] or 0) > 3000, counts
          assert (counts['gnjoy_market_current'] or 0) > 0, counts
          assert (counts['gnjoy_live_current'] or 0) > 0, counts
          assert len(errors) <= 50, errors[:10]

          closeout = {
              'status': 'bulk_collection_closed',
              'closed_at_utc': datetime.now(timezone.utc).isoformat(),
              'scope': 'all data actually acquired from direct sources and the existing Supabase cache',
              'portable_database': 'ai/ragnarok-ai.duckdb',
              'verified_counts': counts,
              'merge_warning_count': len(errors),
              'merge_warnings': errors,
              'graph_snapshot': {
                  'entity_count': graph.get('entity_count'),
                  'link_count': graph.get('link_count'),
                  'entity_types': graph.get('entity_types'),
                  'relation_groups': graph.get('relation_groups'),
                  'resolution': graph.get('resolution'),
                  'latest_run': graph.get('latest_run'),
              },
              'known_boundaries': [
                  'Divine Pride was not brute-force mirrored; only data already acquired under the existing safe collection policy is included.',
                  'RagnaPlace sitemap indexes are retained as references; detailed API collection remains unavailable without an approved API key.',
                  'GNJOY official-market rows are ranking and trade-count snapshots, not complete seller price history.',
                  'Partial relationship targets remain documented rather than guessed or deleted.',
                  'Disabled third-party site HTML is reference-only and is not promoted into the canonical AI view.',
              ],
              'future_policy': 'bulk collection is closed; only official/client update deltas should be appended after this snapshot',
          }
          out = root / 'manifest' / 'COLLECTION_CLOSEOUT.json'
          out.write_text(json.dumps(closeout, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(closeout, ensure_ascii=False, indent=2))
          PY

      - name: Package final portable snapshot
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p upload
          (cd export/manifest && zip -9 -r ../../upload/00_collection_closeout.zip .)
          (cd export/raw && zip -0 -r ../../upload/01_raw_sources_closeout.zip .)
          (cd export/canonical && zip -0 -r ../../upload/02_canonical_closeout.zip .)
          (cd export/relations && zip -0 -r ../../upload/03_relations_closeout.zip .)
          (cd export/supabase_current && zip -0 -r ../../upload/05_supabase_current_closeout.zip .)

          python - <<'PY'
          from pathlib import Path
          import zstandard as zstd

          src = Path('export/ai/ragnarok-ai.duckdb')
          dst = Path('upload/ragnarok-ai-collection-closeout.duckdb.zst')
          with src.open('rb') as inp, dst.open('wb') as out:
              zstd.ZstdCompressor(level=19, threads=-1).copy_stream(inp, out)
          print(f'{dst}: {dst.stat().st_size} bytes')
          PY

          cp export/manifest/COLLECTION_CLOSEOUT.json upload/COLLECTION_CLOSEOUT.json
          sha256sum upload/* > upload/SHA256SUMS_CLOSEOUT.txt
          find upload -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload final closeout artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-collection-closeout
          path: upload/*
          retention-days: 30
          compression-level: 0

      - name: Publish final transfer release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=ragnarok-ai-collection-closeout
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title 'Ragnarok AI DB — Collection Closeout' \
              --notes 'Final bulk-collection snapshot. Future work is limited to official/client update deltas.' \
              --prerelease
          fi
          gh release upload "$TAG" --clobber upload/*
