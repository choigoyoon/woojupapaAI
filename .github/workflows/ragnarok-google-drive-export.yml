name: Build Ragnarok AI DB for Google Drive

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ragnarok-google-drive-export.yml'
      - 'ragnarok-data-pipeline/build_ai_db.py.gz.b64'

permissions:
  contents: read

concurrency:
  group: ragnarok-google-drive-export
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4

      - name: Checkout direct source repositories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p sources
          git clone --depth 1 https://github.com/rathena/rathena.git sources/rathena
          git clone --depth 1 https://github.com/OpenKore/openkore.git sources/openkore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install database builders
        run: python -m pip install --upgrade duckdb pyarrow pandas pyyaml requests

      - name: Restore portable DB builder
        shell: bash
        run: |
          base64 -d ragnarok-data-pipeline/build_ai_db.py.gz.b64 | gzip -d > /tmp/build_ai_db.py
          python -m py_compile /tmp/build_ai_db.py

      - name: Build raw, canonical, relation and AI files
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf export upload
          python /tmp/build_ai_db.py --rathena sources/rathena --openkore sources/openkore --out export
          mkdir -p upload
          (cd export/manifest && zip -9 -r ../../upload/00_manifest.zip .)
          (cd export/raw && zip -0 -r ../../upload/01_raw_sources.zip .)
          (cd export/canonical && zip -0 -r ../../upload/02_canonical_parquet.zip .)
          (cd export/relations && zip -0 -r ../../upload/03_relations_parquet.zip .)
          (cd export/ai && zip -0 -r ../../upload/04_ai_duckdb.zip .)
          sha256sum upload/* > upload/SHA256SUMS.txt
          find upload -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload manifest bundle
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-00-manifest
          path: upload/00_manifest.zip
          retention-days: 7

      - name: Upload raw source bundle
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-01-raw-sources
          path: upload/01_raw_sources.zip
          retention-days: 7
          compression-level: 0

      - name: Upload canonical bundle
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-02-canonical
          path: upload/02_canonical_parquet.zip
          retention-days: 7
          compression-level: 0

      - name: Upload relation bundle
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-03-relations
          path: upload/03_relations_parquet.zip
          retention-days: 7
          compression-level: 0

      - name: Upload AI database bundle
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-04-ai-duckdb
          path: upload/04_ai_duckdb.zip
          retention-days: 7
          compression-level: 0

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-checksums
          path: upload/SHA256SUMS.txt
          retention-days: 7
