name: Clean temporary Ragnarok export workflows

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-ragnarok-export-temporary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary workflows
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/probe-ragnarok-endpoints.yml
          rm -f .github/workflows/ragnarok-google-drive-export-v2.yml
          rm -f .github/workflows/cleanup-ragnarok-export-temporary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo 'nothing to clean'
          else
            git commit -m 'Remove temporary Ragnarok export workflows'
            git push origin HEAD:master
          fi
