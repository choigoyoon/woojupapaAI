name: Probe Ragnarok Endpoints
on:
  push:
    branches: [master]
    paths: ['.github/workflows/probe-ragnarok-endpoints.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - shell: bash
        run: |
          set +e
          BASE='https://lejxxzrjorfexgtvegjf.supabase.co/functions/v1'
          curl -sS --max-time 30 "$BASE/ragnarok-hub" -o /tmp/hub.html
          echo '===== HUB CALL SITES ====='
          grep -nE "callApi\(|apiCall\(|requestApi\(" /tmp/hub.html | tail -120 || true
          echo '===== ROUTE TESTS ====='
          for spec in \
            'ragnarok-hub?api=search&q=&type=item&limit=3' \
            'ragnarok-hub?api=search&q=&type=item&limit=3&offset=3' \
            'ragnarok-hub?api=search&q=&type=item&limit=3&page=2' \
            'ragnarok-hub?api=search&q=&type=item&limit=3&source=divine_pride' \
            'ragnarok-hub?api=search&q=&type=monster&limit=3&source=divine_pride' \
            'ragnarok-hub?api=entities&type=item&limit=3' \
            'ragnarok-hub?api=export&dataset=dp_entities&limit=3' \
            'ragnarok-graph?api=search&q=&type=item&limit=3' \
            'ragnarok-graph?api=search&q=&type=item&limit=3&offset=3' \
            'ragnarok-graph?api=search&q=&type=item&limit=3&page=2' \
            'ragnarok-graph?api=search&q=&type=item&limit=3&source=divine_pride'; do
            echo "===== $spec ====="
            body=$(curl -sS --max-time 30 -w '\n__HTTP__=%{http_code}' "$BASE/$spec")
            printf '%s\n' "$body" | head -c 24000
            echo
          done
