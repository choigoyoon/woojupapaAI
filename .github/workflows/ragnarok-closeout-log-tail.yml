name: Inspect Ragnarok Stage1 Schema

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ragnarok-closeout-log-tail.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download stage-1 database artifact
        uses: actions/download-artifact@v4
        with:
          name: ragnarok-04-ai-duckdb
          path: stage1
          github-token: ${{ github.token }}
          run-id: 34194248237
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade duckdb
      - name: Inspect objects, schemas and counts
        shell: bash
        run: |
          set -euxo pipefail
          find stage1 -maxdepth 2 -type f -printf '%p %s bytes\n'
          rm -rf stage1_db
          mkdir -p stage1_db
          unzip -q stage1/04_ai_duckdb.zip -d stage1_db
          python - <<'PY'
          import json
          from pathlib import Path
          import duckdb

          db = next(Path('stage1_db').glob('*.duckdb'))
          con = duckdb.connect(str(db), read_only=True)
          objects = con.execute(
              "SELECT table_name, table_type FROM information_schema.tables "
              "WHERE table_schema='main' ORDER BY table_type, table_name"
          ).fetchall()
          print('OBJECTS=' + json.dumps(objects, ensure_ascii=False))
          for name in ['entities', 'relations', 'ai_entities_current', 'ai_relation_edges']:
              try:
                  schema = con.execute(f'DESCRIBE "{name}"').fetchall()
                  count = con.execute(f'SELECT count(*) FROM "{name}"').fetchone()[0]
                  print(name + '_SCHEMA=' + json.dumps(schema, ensure_ascii=False))
                  print(name + '_COUNT=' + str(count))
              except Exception as exc:
                  print(name + '_ERROR=' + repr(exc))
          con.close()
          PY
