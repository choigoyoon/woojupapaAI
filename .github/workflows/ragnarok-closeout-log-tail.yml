name: Inspect Closeout SQL Smoke Failure

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ragnarok-closeout-log-tail.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print final failed lines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 34215088865 --repo "$GITHUB_REPOSITORY" --log-failed | tail -n 35
