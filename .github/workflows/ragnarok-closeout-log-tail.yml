name: Inspect Ragnarok Merge Builder

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ragnarok-closeout-log-tail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print merge builder section
        run: |
          base64 -d ragnarok-data-pipeline/merge_supabase_current.py.gz.b64 | gzip -d > /tmp/merge.py
          nl -ba /tmp/merge.py | sed -n '200,390p'
