name: Build Ragnarok AI DB Stage 2

on:
  push:
    branches: [master]
    paths:
      - 'tools/ragnarok/build_stage2_portable.py'
      - '.github/workflows/ragnarok-google-drive-stage2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ragnarok-google-drive-stage2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4

      - name: Download verified stage 1 DuckDB
        uses: actions/download-artifact@v4
        with:
          name: ragnarok-04-ai-duckdb
          path: stage1
          github-token: ${{ github.token }}
          run-id: 34194248237

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install export builders
        run: python -m pip install --upgrade duckdb pyarrow pandas requests zstandard

      - name: Export Supabase direct data and merge DuckDB
        run: >-
          python tools/ragnarok/build_stage2_portable.py
          --endpoint https://lejxxzrjorfexgtvegjf.supabase.co/functions/v1/ragnarok-portable-export
          --stage1-root stage1
          --output stage2

      - name: Upload stage 2 manifest
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-stage2-00-manifest
          path: |
            stage2/bundle/stage2_manifest.json
            stage2/bundle/README_STAGE2_KO.md
          retention-days: 7

      - name: Upload exact Supabase public data
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-stage2-05-exact
          path: stage2/bundle/05_supabase_exact_jsonl.zip
          retention-days: 7

      - name: Upload normalized Supabase Parquet
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-stage2-06-parquet
          path: stage2/bundle/06_supabase_direct_parquet.zip
          retention-days: 7

      - name: Upload full AI DuckDB
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-stage2-07-ai-duckdb
          path: stage2/bundle/ragnarok-ai-full.duckdb.zst
          retention-days: 7

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-stage2-checksums
          path: stage2/bundle/SHA256SUMS_STAGE2.txt
          retention-days: 7
