name: Ragnarok Final API Discovery

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ragnarok-final-probe2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Discover routes and pagination
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://lejxxzrjorfexgtvegjf.supabase.co/functions/v1'
          curl -sS -L --max-time 40 "$BASE/ragnarok-hub" -o /tmp/hub.html
          echo '===== LINES CONTAINING API CALLS ====='
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/hub.html').read_text(encoding='utf-8',errors='replace')
          for i,line in enumerate(s.splitlines(),1):
              if any(k in line for k in ('URLSearchParams','searchParams','fetch(','api=',"api:",'callApi','apiCall','requestApi','const api')):
                  print(f'{i}: {line[:4000]}')
          print('===== STRING LITERALS NEAR API =====')
          for m in re.finditer(r'.{0,160}(?:api|fetch|searchParams).{0,300}',s,re.I|re.S):
              block=' '.join(m.group(0).split())
              print(block[:600])
          PY

          echo '===== HUB TESTS ====='
          tests=(
            'search&q=&type=item&limit=2&offset=0'
            'search&q=&type=item&limit=2&offset=2'
            'search&q=&type=item&limit=2&page=2'
            'search&q=&type=item&limit=1000&offset=0'
            'detail&type=item&id=22721'
            'entity&type=item&id=22721'
            'detail&type=skill&id=298'
            'entity&type=skill&id=298'
            'module-status'
            'modules'
            'source-status'
            'inventory'
            'live&limit=100'
            'official-market&limit=100'
          )
          for q in "${tests[@]}"; do
            echo "----- api=$q -----"
            curl -sS -L --max-time 60 -w '\nHTTP=%{http_code} SIZE=%{size_download}\n' "$BASE/ragnarok-hub?api=$q" | head -c 30000
            echo
          done

          echo '===== GRAPH TESTS ====='
          for q in 'status' 'inventory' 'references' 'monsters&limit=3' 'hunting&limit=3' 'ragnaplace-status'; do
            echo "----- graph api=$q -----"
            curl -sS -L --max-time 60 -w '\nHTTP=%{http_code} SIZE=%{size_download}\n' "$BASE/ragnarok-graph?api=$q" | head -c 30000
            echo
          done
