name: GX10 Agent Bootstrap

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/gx10-agent-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-gx10:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Inspect runner and prepare Ragnarok workspace
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/gx10-bootstrap.txt"
          {
            echo "checked_at_utc=$(date -u +%FT%TZ)"
            echo "hostname=$(hostname 2>/dev/null || true)"
            echo "user=$(id -un 2>/dev/null || true)"
            echo "uid=$(id -u 2>/dev/null || true)"
            echo "kernel=$(uname -a 2>/dev/null || true)"
            echo "home=${HOME:-}"
            echo "runner_name=${RUNNER_NAME:-}"
            echo "runner_os=${RUNNER_OS:-}"
            echo "runner_arch=${RUNNER_ARCH:-}"
            echo "pwd=$(pwd)"
            echo
            echo '[disk]'
            df -h 2>/dev/null || true
            echo
            echo '[memory]'
            free -h 2>/dev/null || true
            echo
            echo '[tailscale]'
            command -v tailscale 2>/dev/null || true
            tailscale status 2>&1 || true
            echo
            echo '[ssh services]'
            systemctl is-enabled ssh 2>&1 || true
            systemctl is-active ssh 2>&1 || true
            systemctl is-enabled sshd 2>&1 || true
            systemctl is-active sshd 2>&1 || true
            echo
            echo '[sudo noninteractive]'
            if sudo -n true 2>/dev/null; then echo yes; else echo no; fi
            echo
            echo '[workspace]'
            TARGET=/srv/ragnarok-ai
            if sudo -n true 2>/dev/null; then
              sudo mkdir -p "$TARGET"/{raw,current,index,sync,logs}
              sudo chown -R "$(id -u):$(id -g)" "$TARGET"
              echo "workspace=$TARGET"
            else
              TARGET="$HOME/ragnarok-ai"
              mkdir -p "$TARGET"/{raw,current,index,sync,logs}
              echo "workspace=$TARGET"
              echo "fallback_reason=sudo_requires_interaction"
            fi
            find "$TARGET" -maxdepth 1 -type d -printf '%p\n' 2>/dev/null | sort
          } | tee "$OUT"
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: gx10-bootstrap-diagnostic
          path: ${{ runner.temp }}/gx10-bootstrap.txt
          retention-days: 3
