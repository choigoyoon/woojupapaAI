name: Build Ragnarok AI DB v2 for Google Drive

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ragnarok-google-drive-export-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ragnarok-google-drive-export-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4

      - name: Checkout direct source repositories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p sources
          git clone --depth 1 https://github.com/rathena/rathena.git sources/rathena
          git clone --depth 1 https://github.com/OpenKore/openkore.git sources/openkore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install database builders
        run: python -m pip install --upgrade duckdb pyarrow pandas pyyaml requests zstandard

      - name: Restore and patch database builders
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d ragnarok-data-pipeline/build_ai_db.py.gz.b64 | gzip -d > /tmp/build_ai_db.py
          base64 -d ragnarok-data-pipeline/merge_supabase_current.py.gz.b64 | gzip -d > /tmp/merge_supabase_current.py
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('/tmp/merge_supabase_current.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          replacement = ast.parse('print(f"WARNING: {len(errors)} graph fetch errors recorded; continuing with successful rows")').body[0]

          class PatchGraphGuard(ast.NodeTransformer):
              def __init__(self):
                  self.changed = 0
                  self.matches = []

              def visit_Raise(self, node):
                  self.generic_visit(node)
                  if node.exc is None:
                      return node
                  text = ast.unparse(node.exc)
                  if 'RuntimeError' in text and 'graph fetch errors' in text:
                      self.changed += 1
                      self.matches.append((getattr(node, 'lineno', None), text))
                      return ast.copy_location(replacement, node)
                  return node

          patcher = PatchGraphGuard()
          patched = patcher.visit(tree)
          ast.fix_missing_locations(patched)
          print({'patched': patcher.changed, 'matches': patcher.matches})
          if patcher.changed != 1:
              raises = [(getattr(n,'lineno',None), ast.unparse(n.exc)) for n in ast.walk(tree) if isinstance(n, ast.Raise) and n.exc is not None]
              raise RuntimeError(f'expected one graph fetch RuntimeError, patched={patcher.changed}, raises={raises!r}')
          path.write_text(ast.unparse(patched) + '\n', encoding='utf-8')
          PY
          python -m py_compile /tmp/build_ai_db.py /tmp/merge_supabase_current.py

      - name: Build direct-source database
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf export upload
          python /tmp/build_ai_db.py --rathena sources/rathena --openkore sources/openkore --out export

      - name: Merge Supabase Divine Pride, kRO and GNJOY current data
        shell: bash
        env:
          RAGNAROK_EXPORT_WORKERS: '6'
        run: |
          set -euxo pipefail
          python /tmp/merge_supabase_current.py --export export --workers 6 --max-errors 1000

      - name: Verify and package portable database
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import duckdb

          root = Path('export')
          manifest_path = root/'manifest'/'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          db = root/'ai'/'ragnarok-ai.duckdb'
          con = duckdb.connect(str(db), read_only=True)
          required = {
              'ai_entities_current': int(con.execute('select count(*) from ai_entities_current').fetchone()[0]),
              'ai_relation_edges': int(con.execute('select count(*) from ai_relation_edges').fetchone()[0]),
              'supabase_entity_payloads': int(con.execute('select count(*) from supabase_entity_payloads').fetchone()[0]),
              'gnjoy_market_current': int(con.execute('select count(*) from gnjoy_market_current').fetchone()[0]),
              'gnjoy_live_current': int(con.execute('select count(*) from gnjoy_live_current').fetchone()[0]),
          }
          con.close()
          warnings = manifest.get('errors') or []
          assert required['ai_entities_current'] > 50000, required
          assert required['ai_relation_edges'] > 40000, required
          assert required['supabase_entity_payloads'] > 3000, required
          assert required['gnjoy_market_current'] > 0, required
          assert required['gnjoy_live_current'] > 0, required
          assert len(warnings) <= 100, warnings[:5]
          verification = {'status':'pass','counts':required,'warning_count':len(warnings),'warnings':warnings}
          (root/'manifest'/'verification.json').write_text(json.dumps(verification, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(verification, ensure_ascii=False, indent=2))
          PY

          mkdir -p upload
          (cd export/manifest && zip -9 -r ../../upload/00_manifest_v2.zip .)
          (cd export/canonical && zip -0 -r ../../upload/02_canonical_v2.zip .)
          (cd export/relations && zip -0 -r ../../upload/03_relations_v2.zip .)
          (cd export/supabase_current && zip -0 -r ../../upload/05_supabase_current.zip .)

          python - <<'PY'
          from pathlib import Path
          import zstandard as zstd
          src = Path('export/ai/ragnarok-ai.duckdb')
          dst = Path('upload/ragnarok-ai-v2.duckdb.zst')
          with src.open('rb') as inp, dst.open('wb') as out:
              zstd.ZstdCompressor(level=19, threads=-1).copy_stream(inp, out)
          print(f'{dst}: {dst.stat().st_size} bytes')
          PY

          sha256sum upload/* > upload/SHA256SUMS_v2.txt
          find upload -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload v2 manifest
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-v2-00-manifest
          path: upload/00_manifest_v2.zip
          retention-days: 7

      - name: Upload v2 canonical database
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-v2-02-canonical
          path: upload/02_canonical_v2.zip
          retention-days: 7
          compression-level: 0

      - name: Upload v2 relations
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-v2-03-relations
          path: upload/03_relations_v2.zip
          retention-days: 7
          compression-level: 0

      - name: Upload v2 AI database
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-v2-04-ai-duckdb
          path: upload/ragnarok-ai-v2.duckdb.zst
          retention-days: 7
          compression-level: 0

      - name: Upload direct Supabase snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-v2-05-supabase-current
          path: upload/05_supabase_current.zip
          retention-days: 7
          compression-level: 0

      - name: Upload v2 checksums
        uses: actions/upload-artifact@v4
        with:
          name: ragnarok-v2-checksums
          path: upload/SHA256SUMS_v2.txt
          retention-days: 7
