name: Build TWIN OHLCV data

on:
  push:
    branches:
      - twin-ohlcv-data
    paths:
      - .github/workflows/build-twin-ohlcv.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: twin-ohlcv-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify OHLCV
        run: |
          python twin_ohlcv/fetch_binance_5m.py \
            --symbol BTCUSDT \
            --interval 5m \
            --start 2020-01-01 \
            --output twin_ohlcv/data

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twin_ohlcv/data
          if git diff --cached --quiet; then
            echo "No OHLCV changes"
          else
            git commit -m "data: refresh BTCUSDT 5m OHLCV"
            git push origin HEAD:twin-ohlcv-data
          fi

