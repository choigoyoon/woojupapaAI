name: Build TWIN OHLCV data

on:
  push:
    branches:
      - twin-ohlcv-data
    paths:
      - .github/workflows/build-twin-ohlcv.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: twin-ohlcv-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependency
        run: pip install pandas

      - name: Build and verify canonical OHLCV
        run: |
          python twin_ohlcv/build_canonical_5m.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twin_ohlcv/data
          if git diff --cached --quiet; then
            echo "No OHLCV changes"
          else
            git commit -m "data: refresh BTCUSDT 5m OHLCV"
            git push origin HEAD:twin-ohlcv-data
          fi

